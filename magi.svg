<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4000 400" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Les trois Rois mages cheminent vers l'étoile">
<!-- Crèches du monde · Ohain — « Les Rois mages en chemin »
     Illustration originale, style papier découpé / ombre chinoise.
     Trois mages (deux à chameau, un à pied) marchent vers la droite,
     du côté où l'étoile s'est posée. Toile très large (4000×400) : les dunes
     débordent à gauche et à droite, si bien qu'avec background-size:cover
     l'image est toujours mise à l'échelle par sa HAUTEUR et que les mages
     ne sont jamais rognés, du téléphone au très grand écran.
     Mages entre x≈1560 et x≈2170 ; Bethléem lointaine vers x≈2650. -->
<defs>
  <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3e7c2"/>
    <stop offset=".55" stop-color="#e3cf96"/>
    <stop offset="1" stop-color="#c9a54c"/>
  </linearGradient>
  <linearGradient id="orSombre" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b39345"/>
    <stop offset="1" stop-color="#8a6f32"/>
  </linearGradient>
  <linearGradient id="duneAvant" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1424"/>
    <stop offset="1" stop-color="#0f1a2e"/>
  </linearGradient>
  <linearGradient id="duneMilieu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a2a47"/>
    <stop offset="1" stop-color="#121e35"/>
  </linearGradient>
  <linearGradient id="duneFond" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d2e4d" stop-opacity=".9"/>
    <stop offset="1" stop-color="#16243d" stop-opacity=".6"/>
  </linearGradient>
  <filter id="lueur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
    <feFlood flood-color="#e3cf96" flood-opacity=".35"/>
    <feComposite operator="in" in2="SourceAlpha" result="x"/>
    <feGaussianBlur stdDeviation="4" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Chameau (dromadaire) au pas, face à droite, pieds sur y=0.
       Pattes du côté opposé un ton plus sombre : profondeur du papier découpé. -->
  <g id="chameau">
    <path fill="url(#orSombre)" d="M132.0 -104.4 L133.0 -82.7 L129.1 -54.9 L125.8 -30.7 L120.8 -8.7 L127.2 -7.3 L132.2 -29.3 L138.9 -53.1 L145.0 -81.3 L148.0 -103.6 Z M37.2 -108.3 L37.8 -86.2 L31.1 -55.2 L29.8 -30.4 L26.8 -8.4 L33.2 -7.6 L36.2 -29.6 L40.9 -52.8 L54.2 -81.8 L62.8 -103.7 Z M117.5 -1 C117.5 -5 120.8 -7 124.0 -7 C127.2 -7 132.5 -5 132.5 -1 Z M23.5 -1 C23.5 -5 26.8 -7 30.0 -7 C33.2 -7 38.5 -5 38.5 -1 Z"/>
    <path d="M24 -126 C28 -144 42 -154 58 -158 C68 -186 102 -194 120 -168 C128 -158 140 -152 152 -148 C164 -144 174 -136 182 -128 C186 -142 190 -162 200 -172 L204 -180 L208 -174 C218 -172 232 -166 240 -158 C243 -154 242 -149 237 -147 C233 -144 228 -146 224 -146 C216 -146 210 -146 206 -142 C200 -136 196 -126 192 -114 C186 -102 174 -96 162 -96 C156 -94 152 -92 148 -94 C120 -98 96 -100 80 -100 C66 -100 52 -104 40 -108 C30 -112 24 -120 24 -126 Z"/>
    <path d="M141.1 -102.8 L146.6 -80.8 L153.6 -53.0 L159.6 -29.4 L163.6 -7.4 L170.4 -8.6 L166.4 -30.6 L164.4 -55.0 L159.4 -83.2 L158.9 -105.2 Z M55.0 -104.0 L60.7 -85.7 L55.5 -54.7 L59.5 -29.6 L62.5 -7.5 L69.5 -8.5 L66.5 -30.4 L66.5 -53.3 L79.3 -82.3 L85.0 -104.0 Z M161.5 -1 C161.5 -5 164.8 -7 168.0 -7 C171.2 -7 176.5 -5 176.5 -1 Z M60.5 -1 C60.5 -5 63.8 -7 67.0 -7 C70.2 -7 75.5 -5 75.5 -1 Z"/>
    <path fill="none" stroke="url(#or)" stroke-width="3.5" stroke-linecap="round" d="M26 -124 Q14 -112 18 -90"/>
    <!-- selle : deux pommeaux -->
    <path d="M58 -160 L62 -182 L70 -164 Z M116 -166 L124 -184 L128 -162 Z"/>
  </g>
  <!-- Tapis de selle découpé (dessiné en couleur de nuit = découpe) -->
  <g id="tapis" fill="none" stroke="#0f1a2e" stroke-width="2.2" stroke-linecap="round">
    <path d="M52 -150 C60 -136 76 -128 96 -128 C114 -128 128 -136 134 -150"/>
    <path stroke-dasharray="0.1 7" stroke-width="3.4" d="M56 -142 C64 -131 78 -125 96 -125 C112 -125 124 -131 130 -142"/>
  </g>
</defs>

<!-- ======= Paysage (coordonnées décalées : x+1000, y+80) ======= -->
<g transform="translate(1000 80)">
<!-- dune du fond + Bethléem lointaine à droite, sous l'étoile -->
<path fill="url(#duneFond)" d="M-1000 200 C-933 196 -733 177 -600 178 C-467 179 -333 204 -200 206 C-67 208 73 192 200 190 C327 188 413 197 560 196 C707 195 910 185 1080 182 C1250 179 1427 181 1580 178 C1733 175 1863 164 2000 166 C2137 168 2267 188 2400 190 C2533 192 2700 177 2800 176 C2900 175 2967 183 3000 184 L3000 320 L-1000 320 Z"/>
<g fill="#1f3152" opacity=".95">
  <!-- petite ville : maisons cubiques, deux coupoles -->
  <rect x="1640" y="160" width="26" height="22"/>
  <rect x="1662" y="150" width="20" height="32"/>
  <path d="M1684 182 V160 Q1700 140 1716 160 V182 Z"/>
  <rect x="1698" y="134" width="3" height="10"/>
  <rect x="1716" y="164" width="30" height="18"/>
  <rect x="1742" y="154" width="18" height="28"/>
  <path d="M1758 182 V166 Q1768 154 1778 166 V182 Z"/>
  <rect x="1778" y="168" width="22" height="14"/>
</g>
<!-- dune du milieu -->
<path fill="url(#duneMilieu)" d="M-1000 246 C-933 243 -733 229 -600 230 C-467 231 -333 250 -200 250 C-67 250 63 233 200 232 C337 231 460 246 620 246 C780 246 980 234 1160 232 C1340 230 1543 237 1700 236 C1857 235 1967 225 2100 226 C2233 227 2350 243 2500 244 C2650 245 2917 236 3000 234 L3000 320 L-1000 320 Z"/>
<!-- dune avant : le chemin des mages -->
<path fill="url(#duneAvant)" d="M-1000 286 C-917 285 -667 279 -500 280 C-333 281 -133 290 0 290 C133 290 207 282 300 280 C393 278 430 276 560 276 C690 276 907 280 1080 280 C1253 280 1447 273 1600 274 C1753 275 1850 285 2000 286 C2150 287 2333 278 2500 278 C2667 278 2917 283 3000 284 L3000 320 L-1000 320 Z"/>
<!-- filet doré sur la crête -->
<path fill="none" stroke="#c9a54c" stroke-opacity=".55" stroke-width="1.3" d="M-1000 286 C-917 285 -667 279 -500 280 C-333 281 -133 290 0 290 C133 290 207 282 300 280 C393 278 430 276 560 276 C690 276 907 280 1080 280 C1253 280 1447 273 1600 274 C1753 275 1850 285 2000 286 C2150 287 2333 278 2500 278 C2667 278 2917 283 3000 284"/>
<!-- traces de pas derrière la caravane -->
<g fill="#c9a54c" opacity=".35">
  <ellipse cx="300" cy="281" rx="4" ry="1.3"/><ellipse cx="330" cy="280" rx="4" ry="1.3"/>
  <ellipse cx="362" cy="279" rx="4" ry="1.3"/><ellipse cx="394" cy="278" rx="4" ry="1.3"/>
  <ellipse cx="426" cy="277" rx="4" ry="1.3"/><ellipse cx="458" cy="276" rx="4" ry="1.3"/>
  <ellipse cx="490" cy="276" rx="4" ry="1.3"/>
</g>

<!-- ======= Les mages ======= -->
<g fill="url(#or)" filter="url(#lueur)">

  <!-- 3e mage : à chameau, en arrière, porte un vase haut -->
  <g transform="translate(560 278) scale(.86)">
    <g class="pas p3">
      <use href="#chameau"/>
      <use href="#tapis"/>
      <!-- cavalier -->
      <path stroke="#0f1a2e" stroke-width="2.4" paint-order="stroke" d="M62 -166 C68 -190 77 -214 84 -233 L100 -235 C106 -223 108 -210 110 -198 C116 -186 120 -170 120 -150 L122 -137 L131 -135 L131 -130 L108 -130 C104 -146 98 -160 90 -170 C80 -168 70 -164 54 -158 Z"/>
      <!-- turban -->
      <circle cx="95" cy="-244" r="9"/>
      <path d="M83 -248 C82 -262 94 -268 104 -262 C110 -258 110 -250 107 -247 Z"/>
      <!-- bras et vase -->
      <path fill="none" stroke="url(#or)" stroke-width="7" stroke-linecap="round" d="M102 -228 L122 -212"/>
      <path d="M120 -206 C116 -214 118 -226 124 -232 L122 -238 L134 -238 L132 -232 C138 -226 140 -214 136 -206 Z"/>
    </g>
  </g>

  <!-- 2e mage : à chameau, tient les rênes et un coffret -->
  <g transform="translate(800 280) scale(.92)">
    <g class="pas p2">
      <use href="#chameau"/>
      <use href="#tapis"/>
      <path stroke="#0f1a2e" stroke-width="2.4" paint-order="stroke" d="M62 -166 C68 -190 77 -214 84 -233 L100 -235 C106 -223 108 -210 110 -198 C116 -186 120 -170 120 -150 L122 -137 L131 -135 L131 -130 L108 -130 C104 -146 98 -160 90 -170 C80 -168 70 -164 54 -158 Z"/>
      <!-- tête, barbe et couronne -->
      <circle cx="95" cy="-244" r="9"/>
      <path d="M100 -240 C106 -236 106 -228 99 -224 L96 -238 Z"/>
      <path d="M85 -250 L85 -266 L90 -258 L95 -270 L100 -258 L105 -266 L105 -250 Z"/>
      <!-- bras, coffret -->
      <path fill="none" stroke="url(#or)" stroke-width="7" stroke-linecap="round" d="M102 -228 L124 -214"/>
      <path d="M120 -222 H140 V-208 H120 Z M121 -222 C122 -230 138 -230 139 -222 Z"/>
      <!-- rênes -->
      <path fill="none" stroke="url(#or)" stroke-width="1.4" d="M126 -210 Q180 -168 232 -152"/>
    </g>
  </g>

  <!-- 1er mage : à pied, en tête, bâton à la main, montre l'étoile -->
  <g transform="translate(1080 280) scale(1.02)">
    <g class="pas p1">
      <!-- manteau qui flotte derrière -->
      <path fill="url(#orSombre)" d="M20 -122 C2 -100 -12 -62 -22 -6 L2 -4 C6 -44 14 -86 26 -116 Z"/>
      <!-- robe, pied avant chaussé en pointe -->
      <path d="M-2 0 C4 -42 10 -94 18 -124 L42 -124 C48 -96 56 -50 62 -6 L72 -4 L72 0 L44 0 L40 -8 L34 0 Z"/>
      <!-- tête, barbe, bonnet phrygien -->
      <circle cx="31" cy="-136" r="10"/>
      <path d="M37 -132 C45 -128 45 -119 37 -114 L34 -130 Z"/>
      <path d="M20 -140 C18 -158 28 -175 44 -173 C49 -172 51 -166 46 -164 C40 -166 40 -156 42 -140 Z"/>
      <!-- bras levé : il montre l'étoile -->
      <path fill="none" stroke="url(#or)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M38 -118 L52 -132 L62 -152"/>
      <path fill="none" stroke="url(#or)" stroke-width="3" stroke-linecap="round" d="M62 -152 L66 -161"/>
      <!-- l'autre main porte l'encensoir -->
      <path fill="none" stroke="url(#or)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M34 -112 L48 -98 L58 -100"/>
      <path fill="none" stroke="url(#or)" stroke-width="1.3" d="M60 -100 L62 -76"/>
      <path d="M54 -76 H70 C70 -67 66 -62 62 -62 C58 -62 54 -67 54 -76 Z M57 -76 C57 -82 67 -82 67 -76 Z"/>
    </g>
  </g>
</g>

</g><!-- fin du décalage -->

<style>
  .pas{transform-box:fill-box;transform-origin:50% 100%;animation:pas 3.2s ease-in-out infinite}
  .p2{animation-delay:-1.1s}
  .p3{animation-delay:-2.2s}
  @keyframes pas{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-1.6px) rotate(.5deg)}75%{transform:translateY(-1px) rotate(-.4deg)}}
  @media (prefers-reduced-motion:reduce){.pas{animation:none}}
</style>
</svg>
